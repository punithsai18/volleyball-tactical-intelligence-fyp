services:
  - type: web
    name: volleyball-tactical-intelligence-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
    autoDeploy: true
    healthCheckPath: /api/health
